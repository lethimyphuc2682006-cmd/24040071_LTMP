<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #29343a;
      --muted: #64747a;
      --accent: #5b9bd5;
      --paper: #ffffff;
      --background: #edf6ff;
      --line: #dceafa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: var(--background);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 52px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(59, 112, 163, 0.08);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 30px;
      font-size: clamp(2rem, 6vw, 2.8rem);
      line-height: 1.15;
    }
    dl { margin: 0; }
    .item {
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    dt {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }
    dd {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    @media (max-width: 420px) {
      body { padding: 18px 12px; }
      main { border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Giới thiệu</p>
    <h1>Lê Thị Mỹ Phúc</h1>
    <dl>
      <div class="item">
        <dt>Chuyên ngành</dt>
        <dd>Quan hệ công chúng</dd>
      </div>
      <div class="item">
        <dt>Kỹ năng</dt>
        <dd>Thiết kế, edit, conten</dd>
      </div>
      <div class="item">
        <dt>Mục tiêu nghề nghiệp</dt>
        <dd>Chuyên viên quản lí sự kiện</dd>
      </div>
    </dl>
  </main>
</body>
</html>
